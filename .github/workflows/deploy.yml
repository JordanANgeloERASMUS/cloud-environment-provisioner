name: Provision AWS environment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-environment-production
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.operation }} AWS environment
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VAR_site_bucket_name: ${{ vars.TF_SITE_BUCKET_NAME }}
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
      TF_VAR_environment: production
      TF_VAR_enable_budget: ${{ vars.TF_ENABLE_BUDGET }}
      TF_VAR_monthly_budget_limit: ${{ vars.TF_MONTHLY_BUDGET_LIMIT }}
      TF_VAR_budget_notification_email: ${{ vars.TF_BUDGET_NOTIFICATION_EMAIL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize remote state
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION"

      - name: Plan infrastructure
        if: inputs.operation == 'plan' || inputs.operation == 'apply'
        run: terraform plan -input=false -out=tfplan

      - name: Apply infrastructure
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Destroy infrastructure
        if: inputs.operation == 'destroy'
        run: terraform destroy -input=false -auto-approve
